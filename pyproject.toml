[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "atp-tennis-ml-case-study"
version = "0.1.0"
description = "Leakage-aware demonstrator extracted from a team academic tennis prediction notebook"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "xgboost>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyterlab>=4", "matplotlib>=3.7", "seaborn>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
